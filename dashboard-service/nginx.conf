server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: react-router-dom's BrowserRouter (App.jsx) serves
    # routes like /search via client-side history, not real files --
    # without this, a direct request or hard refresh on /search 404s,
    # since nginx would otherwise look for a literal /search file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
